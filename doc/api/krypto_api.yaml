openapi: 3.0.3
servers:
  - url: http://127.0.0.1:2137

info:
  title: Wstępne API kryptograficzne
  version: '0.1'
  license:
    name: 'Do What the Fuck You Want to Public License' # uzupełnij jak wybierzemy licencje
    url: 'https://www.wtfpl.net/about/' # uzupełnij jak wybierzemy licencje
  
security:
  - bearer_http_authentication: []
  #- tls_security

paths:
  /auth/init:
    post:
      security: [] #sprecyzuj potem, potrzebuje być inne bo user jeszcze nie ma JWT

      operationId: initiate_login

      tags: 
        - auth
      summary: wysyła wyzwanie serwerowi i prośbe o challenge
      description: zaczyna challenge response handshake dając wyzwanie serwerowi, do klienta zwracana jest losowa wartość (serwer ją zapisuje aby ją później potwierdzić) oraz odpowiedź na jego wyzwanie podpisana kluczem prywatnym serwera
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/challenge_request'
      
      responses:
        '200':
          $ref: "#/components/responses/send_challange_200"
        '400':
          $ref: "#/components/responses/bad_request_400"
        '408':
          $ref: "#/components/responses/request_timeout_408"
        '429':
          $ref: "#/components/responses/too_many_requests_429"
        '500':
          $ref: "#/components/responses/internal_server_error_500"
        default:
          $ref: "#/components/responses/generic_error"
  
  /auth/login:
    post:
      security: [] #sprecyzuj potem, potrzebuje być inne bo user jeszcze nie ma JWT
      
      operationId: login

      tags: 
        - auth
      summary: loguje sie używając odpowiedzi na wyzwanie
      description: klient wysyła do serwera podpisaną swoim prywatnym kluczem wartość którą dostał od serwera i dostaje spowrotem session token. Trzeba zaimplementować timeout
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/login_request'
      
      responses:
        '200':
          $ref: "#/components/responses/send_session_token_200"
        '400':
          $ref: "#/components/responses/bad_request_400"
        '403':
          $ref: "#/components/responses/wrong_login_info_403"  
        '408':
          $ref: "#/components/responses/request_timeout_408"
        '418':
          $ref: "#/components/responses/im_a_teapot_418"
        '429':
          $ref: "#/components/responses/too_many_requests_429"
        '500':
          $ref: "#/components/responses/internal_server_error_500"
        default:
          $ref: "#/components/responses/generic_error"

components:
  securitySchemes: 
    # ========= ważne schematy bezpieczeństwa =========

    bearer_http_authentication:
      type: http
      scheme: bearer
      
    #tls_security:
    #  type: mutualTLS #wyłączone na razie, potem upgradeujemy na openAPI 3.1.0

  schemas:
    # ========= ważne zmienne =========
    
    user_id:
      type: string
      format: byte
      description: hash username'a którego używa dany klient, przekształcony na base64. serwer nie zna nazwy użytkownika dla prywatności
    
    nonce:
      type: string
      format: byte
      minLength: 44 #tutaj js używa character jako minLnegth czyli długość nonce to 32 bajty losowych danych i to przekształcone na base64 daje 44 znaków
      description: kompletnie losowo wygenerowany ciąg bitów przekształcony w format base64. BARDZO WAŻNE ABY BYŁ ON UNIKATOWY. Powinniśmy używać do jego generacji NIEDETERMINISTYCZNY algorytm 
    
    signature:
      type: string
      format: byte
      description: podpisanty skrót wiadomości
      
    auth_token:
      type: string
      format: byte
      description: authentication token used by the client
    
    html:
      type: string
      format: html
      description: tekst html do wysłania jako odpowiedź na żądanie
    
    reason:
      type: string
      format: reason_for_response
      description: VERY VAGUE DESCRIPTION OF WHAT CAUSED THE ERROR CODE. DO NOT BE SPECIFIC!!!!!!!!!
    
    # ========= ważne obiekty =========
    
    challenge_request:
      type: object
      
      properties:
        uid:
          $ref: '#/components/schemas/user_id'
        
        client_challenge:
          description: nonce wygenerowany przez klienta
          allOf: 
            - $ref: '#/components/schemas/nonce'
      
      required:
        - uid
        - client_challenge

    challenge:  
      type: object

      properties: 
        server_challenge_response:
          description: podpisany przez serwer nonce który dostał od klienta
          allOf:
            - $ref: "#/components/schemas/signature"
        
        server_challenge:
          description: nonce wygenerowany jako wyzwanie do klienta
          allOf:
            - $ref: "#/components/schemas/nonce"
    
    # ^^^ rozpoczęcie logowania ^^^
          
      required:
        - server_challenge_response
        - server_challenge
    
    login_request:
      type: object
      
      properties:
        uid:
          $ref: '#/components/schemas/user_id'
        
        client_login:
          description: podpisane prywatnym kluczem klienta wyzwa  nie wysłane przez serwer
          allOf:
            - $ref: '#/components/schemas/signature'
      
      required:
        - uid
        - client_login

    login:
      type: object

      properties: 
        token:
          $ref: "#/components/schemas/auth_token"
          
      required:
        - token
    
    # ^^^ logowanie ^^^
    
    html_response:
      type: object

      properties: 
        html:
          $ref: "#/components/schemas/html"
        
        response_reason:
          $ref: "#/components/schemas/reason"
      
      required:
        - html
    
  responses: 
    # ========= odpowiedzi serwera =========
    'OK_200':
      description: klient wysłał poprawne żądanie
      content: 
        application/json:
          schema: 
            $ref: "#/components/schemas/html_response"
    
    'send_challange_200':
      description: serwer wysyła odpowiedź na wyzwanie wraz ze swoim wyzwaniem
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/challenge"
    
    'send_session_token_200':
      description: serwer wysyła klientowi session token
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/login"

    # ^^^ 2XX ^^^

    'bad_request_400':
      description: klient wysłał źle sformatowane żądanie
      content: 
        application/json:
          schema: 
            $ref: "#/components/schemas/html_response"
      
    'wrong_login_info_403':
      description: klient podał albo zły nonce albo niepoprawny uid LUB klient nie wysłał odpowiedzi wystarczająco szybko
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/html_response"
    
    'request_timeout_408':
      description: serwer czekał za długo na wiadomość
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/html_response"
              
    'im_a_teapot_418':
      description: serwer jest czajnikiem
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/html_response"
    
    'too_many_requests_429':
      description: wysłano za dużo zapytań, najlepiej ograniczyć dostęp do serwera przez klienta
      content: 
        application/json:
          schema:
            $ref: "#/components/schemas/html_response"
    # ^^^ 4XX ^^^
    
    'internal_server_error_500':
      description: serwer zachował się niespodziewanie
      content: 
        application/json:
          schema: 
            $ref: "#/components/schemas/html_response"
    
    # ^^^ 5XX ^^^
  
    'generic_error':
      description: wystąpił jakiś błąd ale nie jest zbyt ważne żeby sprecyzować jaki albo nie jest to możliwe
      content: 
        application/json:
          schema: 
            $ref: "#/components/schemas/html_response"