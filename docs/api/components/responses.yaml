responses: 
# ========= odpowiedzi serwera =========
  'OK_200':
    description: klient wysłał poprawne żądanie
    content: 
      application/json:
        schema: 
          $ref: "./schemas/core.yaml#/schemas/html_response"

  'send_challange_200':
    description: serwer wysyła odpowiedź na wyzwanie wraz ze swoim wyzwaniem
    content: 
      application/json:
        schema:
          $ref: "./schemas/auth.yaml#/schemas/challenge"

  'send_session_token_200':
    description: serwer wysyła klientowi session token
    content: 
      application/json:
        schema:
          $ref: "./schemas/auth.yaml#/schemas/login"

  # ^^^ 2XX ^^^

  'bad_request_400':
    description: klient wysłał źle sformatowane żądanie
    content: 
      application/json:
        schema: 
          $ref: "./schemas/core.yaml#/schemas/html_response"
    
  'wrong_login_info_403':
    description: klient podał albo zły nonce albo niepoprawny uid LUB klient nie wysłał odpowiedzi wystarczająco szybko
    content: 
      application/json:
        schema:
          $ref: "./schemas/core.yaml#/schemas/html_response"

  'request_timeout_408':
    description: serwer czekał za długo na wiadomość
    content: 
      application/json:
        schema:
          $ref: "./schemas/core.yaml#/schemas/html_response"
            
  'im_a_teapot_418':
    description: serwer jest czajnikiem
    content: 
      application/json:
        schema:
          $ref: "./schemas/core.yaml#/schemas/html_response"

  'too_many_requests_429':
    description: wysłano za dużo zapytań, najlepiej ograniczyć dostęp do serwera przez klienta
    content: 
      application/json:
        schema:
          $ref: "./schemas/core.yaml#/schemas/html_response"
  # ^^^ 4XX ^^^

  'internal_server_error_500':
    description: serwer zachował się niespodziewanie
    content: 
      application/json:
        schema: 
          $ref: "./schemas/core.yaml#/schemas/html_response"

  # ^^^ 5XX ^^^

  'generic_error':
    description: wystąpił jakiś błąd ale nie jest zbyt ważne żeby sprecyzować jaki albo nie jest to możliwe
    content: 
      application/json:
        schema: 
          $ref: "./schemas/core.yaml#/schemas/html_response"