openapi: 3.0.3

info:
  title: "Wstępne API wszystkiego innego niż kryptografia"
  license:
    name: "Do What the Fuck You Want to Public License"
    url: "https://www.wtfpl.net/about/"
  version: "0.1"

servers:
  # trzeba dodać
  - url: "/"

paths:
  /user/{user_id}:
    get:
      operationId: get_user
      summary: "pobierz informacje o użytkowniku"
      description: "pobierz publicznie dostępne informacje o użytkowniku"
      security:
        - CookieAuth: []

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/user_id'

      responses:
        "200":
          description: "serwer odsyła informacje o użytkowniku"
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    $ref: '#/components/schemas/public_key'

        "400":
          description: "podano niepoprawne parametry"

        "401":
          description: "niewłaściwy token"

        "403":
          description: "użytkownik nie ma uprawnień do informacji o tym użytkowniku"

        "404":
          description: "nie znaleziono użytkownika"

  /user/{user_id}/gcs:
    get:
      operationId: get_user_groupchats
      summary: "pobierz listę groupchatów użytkownika"
      description: "pobierz listę groupchatów użytkownika (to samo co w summary bo nie ma o czym się rozwodzić)"
      security:
        - CookieAuth: []

      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/user_id'

      responses:
        "200":
          description: "serwer odsyła listę groupchatów użytkownika"
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_chats:
                    type: array
                    items:
                      $ref: '#/components/schemas/groupchat'

        "400":
          description: "podano niepoprawne parametry"

        "401":
          description: "niewłaściwy token"

        "403":
          description: "użytkownik nie ma uprawnień do informacji o groupchatach tego użytkownika"

        "404":
          description: "nie znaleziono użytkownika"

  /gc/new:
    post:
      operationId: make_groupchat
      summary: "stwórz nowy groupchat"
      description: "stwórz nowy groupchat z określonymi użytkownikami"
      security:
        - CookieAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keys:
                  type: object
                  description: "dict kluczy: user_id: message_key[]"
                  additionalProperties:
                    type: array
                    items:
                      $ref: '#/components/schemas/message_key'

      responses:
        "200":
          description: "pomyślnie utworzono nowy groupchat"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/groupchat'

        "400":
          description: "podano niepoprawne parametry"

        "401":
          description: "niewłaściwy token"

        "403":
          description: "użytkownik nie ma uprawnień do tworzenia groupchatów"

        "404":
          description: "nie znaleziono jednego lub więcej podanych użytkowników"

  /gc/{groupchat_id}:
    get:
      operationId: get_groupchat
      summary: "pobierz informacje o groupchacie"
      description: "pobierz informacje o groupchacie (to samo co w summary bo nie ma o czym się rozwodzić)"
      security:
        - CookieAuth: []

      parameters:
        - name: groupchat_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/groupchat_id'

      responses:
        "200":
          description: "serwer odsyła informacje o groupchacie"
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_chat:
                    $ref: '#/components/schemas/groupchat'
                  message_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/message_key'

        "400":
          description: "podano niepoprawne parametry"

        "401":
          description: "niewłaściwy token"

        "403":
          description: "użytkownik nie ma uprawnień do informacji o tym groupchacie"

        "404":
          description: "nie znaleziono groupchatu"

  /gc/{groupchat_id}/message:
    get:
      operationId: get_groupchat_messages
      summary: "pobierz wiadomości"
      description: "pobierz wiadomości z groupchatu od ostatnio widzianego id"
      security:
        - CookieAuth: []

      parameters:
        - name: groupchat_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/groupchat_id'
        - name: last_seen_id
          in: query
          required: false
          description: "id ostatnio pobranej wiadomości"
          schema:
            $ref: '#/components/schemas/message_id'

      responses:
        "200":
          description: "serwer odsyła listę nowych wiadomości od last_seen_id"
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/encrypted_message'

        "400":
          description: "podano niepoprawne parametry"

        "401":
          description: "niewłaściwy token"

        "403":
          description: "użytkownik nie ma uprawnień do oglądania wiadomości na tym groupchacie"

        "404":
          description: "nie znaleziono groupchatu"

    post:
      operationId: send_groupchat_message
      summary: "wyślij wiadomość"
      description: "wyślij wiadomość do groupchatu. Użytkownik i timestamp dodawany przez serwer?"
      security:
        - CookieAuth: []

      parameters:
        - name: groupchat_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/groupchat_id'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/message'
                key:
                  $ref: '#/components/schemas/message_key_id'

      responses:
        "200":
          description: "wiadomość została przyjęta i zapisana"

        "400":
          description: "podano niepoprawne parametry"

        "401":
          description: "niewłaściwy token"

        "403":
          description: "użytkownik nie ma uprawnień do wysyłania wiadomości na tym groupchacie"

        "404":
          description: "nie znaleziono groupchatu"

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: auth

  schemas:
    # -------- zmienne --------

    user_id:
      type: string
      format: byte
      description: "hash username którego używa dany klient, przekształcony na base64. serwer nie zna nazwy użytkownika dla prywatności"

    groupchat_id:
      type: string
      format: byte
      description: "w sumie to nie wiem jak to będzie wyglądać ale chyba jakieś losowy string?"

    message_key_id:
      type: string
      format: byte
      description: "identyfikator klucza wiadomości"

    message_id:
      type: string
      format: byte
      description: "identyfikator wiadomości"

    public_key:
      type: string
      format: byte
      description: "klucz publiczny użytkownika"

    assymetric_cypher_text:
      type: string
      format: byte
      description: "dane zaszyfrowane asymetrycznie do odszyfrowania kluczem prywatnym użytkownika"

    aes_cypher_text:
      type: string
      format: byte
      description: "dane zaszyfrowane symetrycznie do odszyfrowania kluczem groupchatu"

    message_type:
      type: string
      enum:
        # można pododawać tutaj inne rzeczy ale na razie tylko text używamy
        - text
        - image
        - group_change
      description: "typ przesyłanej wiadomości"

    binary_data:
      type: string
      format: byte
      description: "dane binarne zakodowane w base64?"

    # -------- obiekty --------

    groupchat:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/groupchat_id'
        users:
          type: array
          items:
            $ref: '#/components/schemas/user_id'
        leader:
          $ref: '#/components/schemas/user_id'

    message_key:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/message_key_id'
        users:
          type: array
          items:
            $ref: '#/components/schemas/user_id'
        key:
          $ref: '#/components/schemas/assymetric_cypher_text'

    message:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/message_type'
        content:
          $ref: '#/components/schemas/binary_data'

    encrypted_message:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/message_id'
        message:
          $ref: '#/components/schemas/aes_cypher_text'
        server_metadata:
          $ref: '#/components/schemas/assymetric_cypher_text'
        key_used:
          $ref: '#/components/schemas/message_key_id'
