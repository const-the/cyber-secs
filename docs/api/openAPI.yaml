openapi: 3.1.0 # jak przetestujemy czy endpointy działają zmieniamy na 3.1.0

servers:
  - url: "http://127.0.0.1:2137"

info:
  title: Cyber-SECS API
  version: '0.1'
  description: jeden plik zawierający kombinacje wszystkich napisanych przez nas endpointów, odwołujący się przez $ref do ich implementacji
  license:
    name: GNU AGPLv3
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

security:
  - bearer_http_authentication: []

paths:
  /auth/init:
    $ref: './paths/auth.yaml#/paths/~1auth~1init'
  
  /auth/login:
    $ref: 'paths/auth.yaml#/paths/~1auth~1login'


components:
  securitySchemes:
    $ref: './components/security.yaml#/securitySchemes'