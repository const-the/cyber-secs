paths:
  /msg/send:
    post:
      operationId: send_message

      tags: 
        - msg
      summary: wysyła serwerowi obiekt wiadomości
      description: >
        wysyła serwerowi zaszyfrowany używając szyfru AEAD obiekt message składający się z:
          - wiadomości, która składa się z plaintextu i podpisu, w formacie base64
          - timestampu, który składa się z TSA token podpisanego przez TSA authority, w formacie base64

      requestBody:
        required: true
        content:
          application/json:
            schema: # message
              #$ref: '../components/schemas/auth.yaml#/schemas/challenge_request'
      
      responses: # pomyśl jeszcze jakie inne mogą nastąpić sytuacje i uzupełnij
        '200': 
          $ref: "../components/responses.yaml#/responses/generic_OK_200"
        '400':
          $ref: "../components/responses.yaml#/responses/bad_request_400"
        '408':
          $ref: "../components/responses.yaml#/responses/request_timeout_408"
        '429':
          $ref: "../components/responses.yaml#/responses/too_many_requests_429"
        '500':
          $ref: "../components/responses.yaml#/responses/internal_server_error_500"
        default:
          $ref: "../components/responses.yaml#/responses/generic_error"