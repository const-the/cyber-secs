openapi: 3.0.3

info:
  title: "Wstępne API kryptograficzne"
  version: 0.1

paths:
  /auth/init:
    post:
      tags: 
        - "auth"
      summary: "wysyła wyzwanie serwerowi i prośbe o challange"
      description: "zaczyna challange response handshake dając wyzwanie serwerowi, do klienta zwracana jest losowa wartość (serwer ją zapisuje aby ją później potwierdzić) oraz odpowiedź na jego wyzwanie podpisana kluczem prywatnym serwera"
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/challenge_request"
      
      responses:
        "200":
          description: "serwer wysyła odpowiedź na wyzwanie wraz ze swoim wyzwaniem"
        
        "500":
          description: "coś poszło nie tak"
  
  /auth/login:
    post:
      tags: 
        - "auth"
      summary: "loguje sie używając odpowiedzi na wyzwanie"
      description: "klient wysyła do serwera zaszyfrowaną swoim prywatnym kluczem wartość którą dostał od serwera i dostaje spowrotem session token. Trzeba zaimplementować timeout"
      
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/login_request"
      
      responses:
        "200":
          description: "serwer wysyła klientowi session token"
        
        "400":
          description: "klient podał albo zły nonce albo niepoprawny uid LUB klient nie wysłał odpowiedzi wystarczająco szybko"
        
        "418":
          description: "serwer jest czajnikiem"
        
        "500":
          description: "serwer coś dziwnego odwalił"

components:
  schemas:
    # -------- ważne zmienne --------
    
    user_id:
      type: string
      format: byte
      description: "hash username'a którego używa dany klient, przekształcony na base64. serwer nie zna nazwy użytkownika dla prywatności"
    
    nonce:
      type: string
      format: byte
      minLength: 44 #tutaj js używa character jako minLnegth czyli długość nonce to 32 bajty losowych danych i to przekształcone na base64 daje 44 znaków
      description: "kompletnie losowo wygenerowany ciąg bitów przekształcony w format base64. BARDZO WAŻNE ABY BYŁ ON UNIKATOWY. Powinniśmy używać do jego generacji NIEDETERMINISTYCZNY algorytm" 
    
    signature:
      type: string
      format: byte
      description: "podpisanty skrót wiadomości"
    
    # -------- ważne obiekty --------
    
    challenge_request:
      type: object
      
      properties:
        uid:
          $ref: "#/components/schemas/user_id"
        
        client_challenge:
          description: "nonce wygenerowany przez klienta"
          allOf: 
            - $ref: "#/components/schemas/nonce"
      
      required:
        - uid
        - client_challenge
    
    login_request:
      type: object
      
      properties:
        uid:
          $ref: "#/components/schemas/user_id"
        
        client_login:
          description: "podpisane prywatnym kluczem klienta wyzwanie wysłane przez serwer"
          allOf:
            - $ref: "#/components/schemas/signature"
      
      required:
        - uid
        - client_login
